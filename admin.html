<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #1f2937;
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #111827;
        color: white;
        padding: 20px 25px;
        border-radius: 12px;
        margin-bottom: 25px;
      }

      .header h1 {
        margin: 0;
        font-size: 28px;
      }

      .header button {
        background: #4f46e5;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
        margin-bottom: 25px;
      }

      .card {
        background: white;
        padding: 22px 18px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      .card h3 {
        margin: 0 0 10px;
        color: #6b7280;
        font-size: 14px;
      }

      .card p {
        margin: 0;
        font-size: 30px;
        font-weight: bold;
      }

      .panel {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }

      th, td {
        text-align: left;
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
      }

      th {
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Admin Dashboard</h1>
        <button>Logout</button>
      </div>

      <div class="stats">
        <div class="card">
          <h3>Total Users</h3>
          <p>1,245</p>
        </div>
        <div class="card">
          <h3>Orders</h3>
          <p>428</p>
        </div>
        <div class="card">
          <h3>Revenue</h3>
          <p>$12.4k</p>
        </div>
        <div class="card">
          <h3>Open Tickets</h3>
          <p>24</p>
        </div>
      </div>

      <div class="panel">
        <h2>Recent Users</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>John Doe</td>
              <td>john@example.com</td>
              <td>Active</td>
            </tr>
            <tr>
              <td>Jane Smith</td>
              <td>jane@example.com</td>
              <td>Pending</td>
            </tr>
            <tr>
              <td>Alex Brown</td>
              <td>alex@example.com</td>
              <td>Active</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
