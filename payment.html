<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .payment-box {
        background: #ffffff;
        width: 100%;
        max-width: 420px;
        padding: 30px 25px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      }

      h2 {
        margin: 0 0 20px;
        text-align: center;
      }

      .amount {
        background: #eef2ff;
        padding: 18px;
        border-radius: 10px;
        text-align: center;
        margin-bottom: 20px;
        font-size: 24px;
        font-weight: bold;
        color: #312e81;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #374151;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        margin-bottom: 16px;
        font-size: 14px;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 10px;
        background: #10b981;
        color: white;
        padding: 14px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #059669;
      }
    </style>
  </head>
  <body>
    <div class="payment-box">
      <h2>Payment</h2>

      <div class="amount">$49.99</div>

      <form id="paymentForm">
        <label for="cardName">Name on Card</label>
        <input type="text" id="cardName" placeholder="Your full name" required />

        <label for="cardNumber">Card Number</label>
        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" required />

        <label for="expiry">Expiry Date</label>
        <input type="text" id="expiry" placeholder="MM/YY" required />

        <label for="cvv">CVV</label>
        <input type="password" id="cvv" placeholder="123" required />

        <button type="submit">Pay Now</button>
      </form>
    </div>

    <script>
      document.getElementById('paymentForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const cardName = document.getElementById('cardName').value.trim();
        const cardNumber = document.getElementById('cardNumber').value.trim();

        if (!cardName || !cardNumber) {
          alert('Please fill in the required payment details.');
          return;
        }

        alert('Payment submitted successfully for ' + cardName + '.');
        this.reset();
      });
    </script>
  </body>
</html>
