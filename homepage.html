<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
      }

      .hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eef4ff, #dfe9ff);
        padding: 40px 20px;
      }

      .hero-content {
        max-width: 700px;
        text-align: center;
      }

      .hero h1 {
        font-size: 3rem;
        margin-bottom: 20px;
      }

      .hero p {
        font-size: 1.1rem;
        line-height: 1.6;
        color: #4b5563;
        margin-bottom: 30px;
      }

      .buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s ease;
      }

      .btn-primary {
        background: #4f46e5;
        color: white;
      }

      .btn-secondary {
        background: white;
        color: #1f2937;
        border: 1px solid #d1d5db;
      }

      .btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero-content">
        <h1>Welcome to Our Website</h1>
        <p>
          We provide simple and reliable digital solutions for your business,
          education, and everyday online needs.
        </p>

        <div class="buttons">
          <a href="login.html" class="btn btn-primary">Login</a>
          <a href="#" class="btn btn-secondary">Learn More</a>
        </div>
      </div>
    </section>
  </body>
</html>
